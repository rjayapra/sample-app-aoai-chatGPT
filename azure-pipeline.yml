# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- master

pool:
  name: oscar2managedpool  
  
#pool:
#  name: ntg-oscar-managed-agent-pool

resources:
- repo: self

variables:
  - name: 'port'
    value: '80'
  - name: 'registryServiceConnection'
    value: 'oscar-dev-acr'
  - name: 'stagingRegistryServiceConnection'
    value: 'oscar-staging-acr'
  - name: 'acrRepository'
    value: 'ntg-oscar'


stages:
- stage: Build
  displayName: Build Image
  jobs:
  - job: BuildAndPushOscar
    displayName: Build Oscar Container
    workspace:
      clean: all
    steps:
    - task: Docker@2
      displayName: Login to Container Registry
      inputs: 
        containerRegistry: '$(registryServiceConnection)'
        command: login
    - task: Docker@2
      displayName: Build Oscar app Image
      inputs:
        containerRegistry: '$(registryServiceConnection)'
        repository: '$(acrRepository)'
        command: build
        dockerfile: '$(Build.SourcesDirectory)/WebApp.Dockerfile'
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          latest
          $(Build.BuildId)
    - task: Docker@2
      displayName: Push Oscar app Image to Registry
      inputs:
         command: push
         containerRegistry: '$(registryServiceConnection)'
         repository: '$(acrRepository)'
         tags: |
          latest
          $(Build.BuildId)

- stage: PushToStaging
  displayName: Push Image to Staging ACR
  dependsOn: Build
  jobs:
  - job: PushToStagingACR
    displayName: Tag and Push to Staging Container Registry
    steps:
    - task: Docker@2
      displayName: Login to Dev Container Registry
      inputs: 
        containerRegistry: '$(registryServiceConnection)'
        command: login
    - task: Docker@2
      displayName: Login to Staging Container Registry
      inputs: 
        containerRegistry: '$(stagingRegistryServiceConnection)'
        command: login
    - script: |
        # Pull the image from dev ACR
        docker pull $(registryServiceConnection).azurecr.io/$(acrRepository):$(Build.BuildId)
        
        # Tag for staging ACR
        docker tag $(registryServiceConnection).azurecr.io/$(acrRepository):$(Build.BuildId) $(stagingRegistryServiceConnection).azurecr.io/$(acrRepository):$(Build.BuildId)
        docker tag $(registryServiceConnection).azurecr.io/$(acrRepository):$(Build.BuildId) $(stagingRegistryServiceConnection).azurecr.io/$(acrRepository):latest
        
        # Push to staging ACR
        docker push $(stagingRegistryServiceConnection).azurecr.io/$(acrRepository):$(Build.BuildId)
        docker push $(stagingRegistryServiceConnection).azurecr.io/$(acrRepository):latest
      displayName: Pull, Tag and Push Image to Staging ACR