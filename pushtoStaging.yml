
# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

parameters:
  - name: sourceACR
    displayName: Source ACR
    type: string
    default: ndrcnoscardevacr

  - name: sourceACRSubscription
    displayName: Source ACR Subscription
    type: string
    default: NDDN-RCN-Oscar2-CcDevSub
  
  - name: destinationACR
    displayName: DestinationACR
    type: string
    default: ndrcnoscarstgacr
    
  - name: destinationACRSubscription
    displayName: Destination ACR Subscription
    type: string
    default: NDDN-RCN-Oscar2-CcStgSub
  
  - name: repositoriesToImport
    displayName: Repositories to Import
    type: object
    default:
      - ntg-oscar:<specificTag>

trigger:
- none

pool:
  vmImage: ubuntu-latest

steps:
- ${{ each repository in parameters.repositoriesToImport }}:  
  - task: AzureCLI@2
    displayName: 'Pull ${{ repository }} from ${{ parameters.sourceACR }}'
    name: "SourceACRID"
    inputs:
      azureSubscription: 'oscar-dev-sub-connection'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        # Get the resourceID of the source ACR
        sourceACRID=$(az acr show --name ${{ parameters.sourceACR }} --query "id" --output tsv)
        echo "Source ACR ID: $sourceACRID"
        echo "##vso[task.setvariable variable=sourceACRIDvar;isOutput=true]$sourceACRID"
  - task: AzureCLI@2
    displayName: 'Import ${{ repository }} from ${{ parameters.sourceACR }} to ${{ parameters.destinationACR }}'
    inputs:
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      azureSubscription: 'oscar-stg-sub-connection'
      inlineScript: |
        # Import the repository into the destination registry
        echo "Importing ${{ repository }} to ${{ parameters.destinationACR }}"
        echo "Using source registry ID: $(SourceACRID.sourceACRIDvar)"
        az acr import --name ${{ parameters.destinationACR }} --source ${{ repository }} --image ${{ repository }} --registry $(SourceACRID.sourceACRIDvar) --force